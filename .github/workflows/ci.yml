name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run lint

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: captrack
          POSTGRES_PASSWORD: captrack
          POSTGRES_DB: captrack_test
          POSTGRES_INITDB_ARGS: "-U captrack"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm run build -w server
      - run: npm run test -w server
        env:
          DATABASE_URL: postgresql://captrack:captrack@localhost:5432/captrack_test

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: captrack
          POSTGRES_PASSWORD: captrack
          POSTGRES_DB: captrack_test
          POSTGRES_INITDB_ARGS: "-U captrack"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx playwright install
      - run: npm run build
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://captrack:captrack@localhost:5432/captrack
          DATABASE_URL_TEST: postgresql://captrack:captrack@localhost:5432/captrack_test
          DATABASE_URL_E2E: postgresql://captrack:captrack@localhost:5432/captrack_e2e
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
