version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: captrack-db
    environment:
      POSTGRES_USER: captrack
      POSTGRES_PASSWORD: captrack
      POSTGRES_INITDB_ARGS: "-c timezone=UTC"
    ports:
      - "5433:5432" # Host 5433 (5432 is taken by a native Postgres install on this machine)
    volumes:
      - captrack_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captrack"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  captrack_pgdata:
